<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Claude 账号风控自检 · Risk Self-Check</title>
<style>
  :root{
    --bg:#f7f5f2;
    --card:#ffffff;
    --ink:#22201d;
    --ink-2:#6b655e;
    --ink-3:#9c948b;
    --line:#e7e2db;
    --accent:#c96442;
    --accent-soft:#f6e9e3;
    --ok:#2e7d5b;
    --warn:#c98a11;
    --high:#d9690f;
    --danger:#c23b3b;
    --radius:14px;
    --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.62;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px;margin:0 auto;padding:40px 20px 140px}

  /* ---------- Header ---------- */
  header.top{margin-bottom:22px}
  .eyebrow{
    display:inline-block;font-size:12px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--accent);background:var(--accent-soft);
    padding:4px 10px;border-radius:999px;font-weight:600;margin-bottom:14px;
  }
  h1{font-size:30px;line-height:1.3;margin:0 0 10px;font-weight:700;letter-spacing:-.01em}
  .sub{color:var(--ink-2);font-size:15px;margin:0 0 18px;max-width:640px}
  .notice{
    display:flex;gap:10px;align-items:flex-start;
    background:#fdf6ee;border:1px solid #f0e2cf;border-radius:12px;
    padding:12px 14px;font-size:13px;color:#8a6a3a;
  }
  .notice b{color:#7a5a2a}

  /* ---------- Tools ---------- */
  .tools{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:16px 18px;margin-bottom:16px;
  }
  .tools-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .tools-row .hint{font-size:12.5px;color:var(--ink-3);margin-left:auto}
  button.ghost{
    border:1px solid var(--line);background:#fff;color:var(--ink-2);
    border-radius:10px;font-size:13.5px;font-weight:600;padding:9px 15px;cursor:pointer;font-family:inherit;
  }
  button.ghost:hover{background:#faf8f5}
  button.ghost:disabled{opacity:.55;cursor:progress}
  .tool-msg{font-size:12.5px;color:var(--ink-2);margin-top:10px;display:none;white-space:pre-line}
  .tool-msg.show{display:block}
  .tool-box{margin-top:14px;border-top:1px dashed var(--line);padding-top:14px}
  .chip{
    display:inline-block;border:1px solid var(--line);border-radius:999px;background:#fdfcfb;
    font-size:12.5px;color:var(--ink-2);padding:6px 12px;cursor:pointer;margin:0 8px 8px 0;font-family:inherit;
  }
  .chip:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .hist{display:grid;gap:8px}
  .hist-row{display:flex;align-items:center;gap:12px;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
  .hist-row .t{color:var(--ink-3);font-variant-numeric:tabular-nums}
  .hist-row .s{font-weight:700;font-variant-numeric:tabular-nums}
  .hist-row .lv{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px}
  .hist-row .d{margin-left:auto;font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

  /* ---------- Section ---------- */
  .dim{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;
  }
  .dim-head{
    display:flex;align-items:center;gap:12px;
    padding:16px 18px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,#fdfcfb,#faf8f5);
  }
  .dim-idx{
    width:26px;height:26px;flex:none;border-radius:8px;background:var(--ink);color:#fff;
    font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;
  }
  .dim-name{font-weight:700;font-size:15px}
  .dim-weight{margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:600;
    background:#fbf3ee;color:var(--accent);padding:3px 9px;border-radius:999px}
  .dim-body{padding:8px 18px 18px}

  .q{padding:14px 0 4px;border-top:1px dashed var(--line)}
  .q:first-child{border-top:none}
  .q-text{font-size:14.5px;font-weight:600;margin:0 0 10px;color:#33302c}
  .opts{display:grid;gap:8px}
  label.opt{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--line);border-radius:10px;
    padding:10px 13px;font-size:13.5px;cursor:pointer;
    transition:.14s;background:#fff;color:var(--ink-2);
  }
  label.opt:hover{border-color:#d9d2c9;background:#fcfbf9}
  label.opt input{position:absolute;opacity:0;pointer-events:none}
  .dot{
    width:16px;height:16px;flex:none;border-radius:50%;
    border:1.5px solid #cabfb4;position:relative;transition:.14s;
  }
  label.opt input:checked ~ .dot{border-color:var(--accent);background:var(--accent)}
  label.opt input:checked ~ .dot::after{
    content:"";position:absolute;inset:3.5px;border-radius:50%;background:#fff;
  }
  label.opt:has(input:checked){
    border-color:var(--accent);background:var(--accent-soft);color:#7a3a22;font-weight:600;
  }

  /* ---------- Sticky bar ---------- */
  .bar{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:rgba(255,255,255,.92);backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
  }
  .bar-in{max-width:880px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px}
  .prog{font-size:13px;color:var(--ink-2);white-space:nowrap}
  .prog b{color:var(--ink);font-variant-numeric:tabular-nums}
  .track{flex:1;height:6px;border-radius:999px;background:#ece7e1;overflow:hidden;min-width:80px}
  .track i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
  button.primary{
    border:none;border-radius:10px;background:var(--accent);color:#fff;
    font-size:14px;font-weight:600;padding:11px 22px;cursor:pointer;transition:.15s;white-space:nowrap;
    font-family:inherit;
  }
  button.primary:hover:not(:disabled){background:#b8562f}
  button.primary:disabled{background:#d8cfc6;cursor:not-allowed}
  button.primary.ghosty{background:transparent;color:var(--ink-2);border:1px solid var(--line)}

  /* ---------- Result ---------- */
  .result{display:none;margin-top:8px}
  .result.show{display:block;animation:rise .4s ease}
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .scorecard{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:26px;display:flex;gap:28px;align-items:center;flex-wrap:wrap;
    margin-bottom:18px;
  }
  .gauge{
    --p:0;width:132px;height:132px;flex:none;border-radius:50%;
    background:conic-gradient(var(--gc,var(--accent)) calc(var(--p)*1%),#ece7e1 0);
    display:flex;align-items:center;justify-content:center;position:relative;
  }
  .gauge::after{content:"";position:absolute;inset:11px;border-radius:50%;background:#fff}
  .gauge .val{position:relative;z-index:1;text-align:center}
  .gauge .val b{font-size:34px;font-weight:700;line-height:1;display:block;font-variant-numeric:tabular-nums}
  .gauge .val span{font-size:11px;color:var(--ink-3);letter-spacing:.08em}
  .verdict{flex:1;min-width:240px}
  .badge{
    display:inline-block;font-size:13px;font-weight:700;padding:5px 13px;border-radius:999px;margin-bottom:8px;
  }
  .verdict p{margin:0;font-size:14px;color:var(--ink-2)}
  .verdict .lead{font-size:15.5px;color:var(--ink);font-weight:600;margin-bottom:6px}

  .panel{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    box-shadow:var(--shadow);padding:22px;margin-bottom:18px;
  }
  .panel h3{font-size:15px;margin:0 0 16px;font-weight:700}
  .dimbars{display:grid;gap:12px}
  .db-row{display:grid;grid-template-columns:112px 1fr 52px;align-items:center;gap:12px;font-size:13px}
  .db-name{color:var(--ink-2)}
  .db-track{height:8px;border-radius:999px;background:#efeae4;overflow:hidden}
  .db-track i{display:block;height:100%;width:0;border-radius:999px;transition:width .5s ease}
  .db-val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:var(--ink-2)}

  .advice{display:grid;gap:10px}
  .adv{
    display:flex;gap:12px;align-items:flex-start;
    border:1px solid var(--line);border-left-width:3px;border-radius:10px;padding:12px 14px;background:#fff;
  }
  .adv .tag{
    flex:none;font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.03em;
  }
  .adv .txt{font-size:13.5px;color:var(--ink-2)}
  .adv .txt b{color:var(--ink);font-weight:600;display:block;margin-bottom:2px}
  .adv .src{font-size:11.5px;color:var(--ink-3);margin-top:4px;display:block}
  .lvl-重点{border-left-color:var(--danger)}
  .lvl-重点 .tag{background:#fbeaea;color:var(--danger)}
  .lvl-建议{border-left-color:var(--high)}
  .lvl-建议 .tag{background:#fdf0e5;color:var(--high)}
  .lvl-提示{border-left-color:var(--warn)}
  .lvl-提示 .tag{background:#fdf6e5;color:#a06d0c}
  .empty{color:var(--ink-3);font-size:13.5px}
  .foot{font-size:12px;color:var(--ink-3);margin-top:22px;line-height:1.7}
  .foot a{color:var(--ink-2)}
  .conf{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:5px;margin-left:6px;font-weight:600}
  .conf-high{background:#e7f2ec;color:#2e7d5b}
  .conf-medium{background:#fdf6e5;color:#a06d0c}
  .conf-low{background:#f2efe9;color:#8a8178}
  @media (max-width:600px){
    h1{font-size:24px}
    .scorecard{gap:18px}
    .db-row{grid-template-columns:84px 1fr 44px}
    .tools-row .hint{margin-left:0}
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="eyebrow">Claude Account Risk Self-Check</span>
    <h1>Claude 账号风控自检</h1>
    <p class="sub">回答 16 个问题，按 8 个维度加权打分，定位你的使用环境中哪些方面容易触发 Anthropic 风控，并给出可执行的调整建议。</p>
    <div class="notice">
      <div>
        <b>说明：</b><span id="disclaimer"></span>
      </div>
    </div>
  </header>

  <section class="tools">
    <div class="tools-row">
      <button class="ghost" id="probeBtn">自动探测我的环境</button>
      <button class="ghost" id="sandboxBtn">场景沙盒</button>
      <button class="ghost" id="historyBtn">历史记录</button>
      <span class="hint">探测结果仅作答题建议，可随时手动修改</span>
    </div>
    <div class="tool-msg" id="probeMsg"></div>
    <div class="tool-box" id="sandboxBox" hidden></div>
    <div class="tool-box" id="historyBox" hidden></div>
  </section>

  <main id="quiz"></main>

  <section class="result" id="result"></section>

  <p class="foot" id="foot"></p>
</div>

<div class="bar">
  <div class="bar-in">
    <div class="prog">已作答 <b><span id="done">0</span>/<span id="total">0</span></b></div>
    <div class="track"><i id="fill"></i></div>
    <button class="primary" id="reset" style="display:none">重新开始</button>
    <button class="primary" id="run" disabled>生成检测报告</button>
  </div>
</div>

<!-- 唯一数据源 questions.json → scripts/build_questions.py 生成 questions.js -->
<script src="questions.js"></script>
<script>
if (!window.RISK_PACK) {
  document.write('<p style="padding:40px;color:#c23b3b">无法加载 questions.js。请确认它与 index.html 在同一目录（或先运行 scripts/build_questions.py 生成）。</p>');
}
const PACK = window.RISK_PACK || {levels:[],dimensions:[],questions:[],probe:{}};
const LEVELS = PACK.levels;
const DIMENSIONS = PACK.dimensions;
const QUESTIONS = PACK.questions;
const PROBE = PACK.probe || {};

const answers = {};
const quizEl = document.getElementById('quiz');
const doneEl = document.getElementById('done');
const totalEl = document.getElementById('total');
const fillEl = document.getElementById('fill');
const runBtn = document.getElementById('run');
const resetBtn = document.getElementById('reset');
const resultEl = document.getElementById('result');
const probeMsgEl = document.getElementById('probeMsg');
const sandboxBox = document.getElementById('sandboxBox');
const historyBox = document.getElementById('historyBox');

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- 静态文本 ---------- */
document.getElementById('disclaimer').textContent = PACK.disclaimer || '';
document.getElementById('foot').innerHTML =
  '评分模型：每个维度取该维度问题的平均风险值（0–1），再按维度权重加权求和（0–100）。<br>' +
  '维度权重参考社区案例中的触发频率：' +
  DIMENSIONS.map(d => `${esc(d.name)} ${d.weight}`).join('、') + '。<br>' +
  '条目标注了来源与置信度（<span class="conf conf-high">high</span> ' +
  '<span class="conf conf-medium">medium</span> <span class="conf conf-low">low</span>），' +
  '源自 Anthropic 公开文档与社区高阅读量案例整理；官方规则以 Anthropic Usage Policy、Supported Countries 与 Safeguards 为准。';

/* ---------- 渲染问卷 ---------- */
function renderQuiz(){
  totalEl.textContent = QUESTIONS.length;
  let html = '';
  DIMENSIONS.forEach((dim, i) => {
    const qs = QUESTIONS.filter(q => q.dim === dim.id);
    html += `<section class="dim">
      <div class="dim-head">
        <div class="dim-idx">${i+1}</div>
        <div class="dim-name">${esc(dim.name)}</div>
        <div class="dim-weight">权重 ${dim.weight}</div>
      </div>
      <div class="dim-body">`;
    qs.forEach(q => {
      html += `<div class="q"><p class="q-text">${esc(q.text)}</p><div class="opts">`;
      q.options.forEach((op, oi) => {
        html += `<label class="opt">
          <input type="radio" name="${q.id}" value="${oi}">
          <span class="dot"></span>
          <span>${esc(op.label)}</span>
        </label>`;
      });
      html += `</div></div>`;
    });
    html += `</div></section>`;
  });
  quizEl.innerHTML = html;

  quizEl.querySelectorAll('input[type=radio]').forEach(inp => {
    inp.addEventListener('change', () => {
      answers[inp.name] = Number(inp.value);
      updateProgress();
    });
  });
  updateProgress();
}

function setAnswer(qid, oi){
  const opts = (QUESTIONS.find(q => q.id === qid) || {}).options || [];
  if (oi == null || oi < 0 || oi >= opts.length) return;
  answers[qid] = oi;
  const el = quizEl.querySelector(`input[name="${qid}"][value="${oi}"]`);
  if (el) el.checked = true;
}

function updateProgress(){
  const n = Object.keys(answers).length;
  doneEl.textContent = n;
  fillEl.style.width = (n / QUESTIONS.length * 100) + '%';
  runBtn.disabled = n < QUESTIONS.length;
  runBtn.textContent = n < QUESTIONS.length
    ? `生成检测报告（还差 ${QUESTIONS.length - n} 题）`
    : '生成检测报告';
  resetBtn.style.display = n ? 'inline-block' : 'none';
}

/* ---------- 评分模型（与 CLI 完全一致） ---------- */
function levelOf(score){
  for (const lv of LEVELS){ if (score < lv.max) return lv; }
  return LEVELS[LEVELS.length - 1];
}

function compute(){
  const dimScores = {};
  DIMENSIONS.forEach(d => dimScores[d.id] = {sum:0, n:0});
  QUESTIONS.forEach(q => {
    const oi = answers[q.id];
    if (oi === undefined) return;
    const r = q.options[oi].risk;
    dimScores[q.dim].sum += r;
    dimScores[q.dim].n += 1;
  });
  let total = 0;
  const rows = [];
  DIMENSIONS.forEach(d => {
    const s = dimScores[d.id];
    const avg = s.n ? s.sum / s.n : 0;
    const contrib = avg * d.weight;
    total += contrib;
    rows.push({name:d.name, weight:d.weight, risk:avg, contrib});
  });
  // 与 JS Math.round 一致；Python 端已用 floor(x+0.5) 对齐，故两端同分
  return {total: Math.round(total), rows};
}

function adviceList(){
  const items = [];
  QUESTIONS.forEach(q => {
    const oi = answers[q.id];
    if (oi === undefined) return;
    const op = q.options[oi];
    if (op.risk <= 0 || !op.advice) return;
    const dim = DIMENSIONS.find(d => d.id === q.dim);
    items.push({
      dim: dim.name, weight: dim.weight, risk: op.risk,
      weightScore: dim.weight * op.risk,
      text: op.advice, label: op.label,
      source: (PACK.sources && PACK.sources[op.source]) ? PACK.sources[op.source].label : '',
      confidence: op.confidence || 'low',
    });
  });
  items.sort((a, b) => b.weightScore - a.weightScore);
  return items;
}

function sevOf(risk){
  if (risk >= 0.7) return {cls:'重点', txt:'重点'};
  if (risk >= 0.4) return {cls:'建议', txt:'建议'};
  return {cls:'提示', txt:'提示'};
}

function barColor(risk){
  if (risk < 0.2) return '#2e7d5b';
  if (risk < 0.45) return '#c98a11';
  if (risk < 0.7) return '#d9690f';
  return '#c23b3b';
}

/* ---------- 历史记录（localStorage） ---------- */
const HKEY = 'claude-risk-check:history';

function loadHistory(){
  try { return JSON.parse(localStorage.getItem(HKEY) || '[]'); } catch (e) { return []; }
}
function saveHistory(list){
  try { localStorage.setItem(HKEY, JSON.stringify(list.slice(-20))); } catch (e) {}
}
function pushHistory(score, level){
  const list = loadHistory();
  list.push({t: Date.now(), score, level});
  saveHistory(list);
}
function fmtTime(ms){
  const d = new Date(ms);
  const p = n => String(n).padStart(2, '0');
  return `${d.getMonth()+1}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function renderHistory(){
  const list = loadHistory();
  if (!list.length){ historyBox.innerHTML = '<p class="empty">暂无历史记录。生成检测报告后会自动保存。</p>'; return; }
  let html = '<div class="hist">';
  list.slice().reverse().forEach((r, i, arr) => {
    const lv = levelOf(r.score);
    let delta = '';
    if (i < arr.length - 1){
      const d = r.score - arr[i+1].score;
      if (d !== 0) delta = (d > 0 ? '↑ +' : '↓ ') + d;
    }
    html += `<div class="hist-row">
      <span class="t">${fmtTime(r.t)}</span>
      <span class="s" style="color:${lv.color}">${r.score}</span>
      <span class="lv" style="color:${lv.color};background:${lv.bg}">${esc(lv.name)}</span>
      <span class="d">${delta}</span>
    </div>`;
  });
  html += '</div><button class="ghost" id="clearHist" style="margin-top:12px">清除历史</button>';
  historyBox.innerHTML = html;
  const btn = document.getElementById('clearHist');
  if (btn) btn.addEventListener('click', () => { saveHistory([]); renderHistory(); });
}

/* ---------- 场景沙盒（预设画像，即时算分） ---------- */
function minIndex(q){ let bi=0; q.options.forEach((o,i)=>{ if(o.risk < q.options[bi].risk) bi=i; }); return bi; }
function maxIndex(q){ let bi=0; q.options.forEach((o,i)=>{ if(o.risk > q.options[bi].risk) bi=i; }); return bi; }

function presetMap(kind){
  const map = {};
  QUESTIONS.forEach(q => { map[q.id] = kind === 'risky' ? maxIndex(q) : minIndex(q); });
  if (kind === 'typical'){
    const t = {q1:0,q2:0,q3:0,q4:1,q5:1,q6:1,q7:1,q8:1,q9:1,q10:1,q11:1,q12:0,q13:1,q14:1,q15:1,q16:1};
    Object.keys(t).forEach(k => { if (QUESTIONS.some(q => q.id === k)) map[k] = t[k]; });
  }
  return map;
}

const SANDBOX_PRESETS = [
  {key:'clean',   label:'理想画像（各项最干净）'},
  {key:'typical', label:'普通海外用户'},
  {key:'risky',   label:'高危画像（新号 + 机房 IP + 24h 无人值守）'},
];

function renderSandbox(){
  let html = '<div style="font-size:13px;color:#6b655e;margin-bottom:10px">' +
    '点击预设画像，一键填入问卷并即时算分，用于对比「调整前后」的差异：</div>';
  SANDBOX_PRESETS.forEach(p => {
    html += `<button class="chip" data-preset="${p.key}">${esc(p.label)}</button>`;
  });
  sandboxBox.innerHTML = html;
  sandboxBox.querySelectorAll('button[data-preset]').forEach(btn => {
    btn.addEventListener('click', () => {
      const map = presetMap(btn.dataset.preset);
      Object.keys(answers).forEach(k => delete answers[k]);
      quizEl.querySelectorAll('input[type=radio]').forEach(i => i.checked = false);
      Object.keys(map).forEach(qid => setAnswer(qid, map[qid]));
      updateProgress();
      renderResult();
    });
  });
}

/* ---------- 自动探测（容错，失败静默降级） ---------- */
function classifyIpType(org){
  if (!org) return 1;
  const s = String(org).toLowerCase();
  if ((PROBE.proxy_keywords || []).some(k => s.includes(k))) return 3;
  if ((PROBE.datacenter_keywords || []).some(k => s.includes(k))) return 2;
  return 0;
}
function classifyRegion(cc){
  if (!cc) return 1;
  return (PROBE.supported_countries || []).includes(String(cc).toUpperCase()) ? 0 : 2;
}
function isUtc8(tz){
  const off = -new Date().getTimezoneOffset() / 60;
  if (off === 8) return true;
  return (PROBE.utc8_tz_names || []).includes(String(tz || '').toLowerCase());
}
function classifyEnv(tz, lang, cc){
  if (!tz || !lang) return null;
  const l = String(lang).toLowerCase();
  const c = String(cc || '').toUpperCase();
  if (c && c !== 'CN'){
    if (l.startsWith('zh') && isUtc8(tz)) return 2;
    if (l.startsWith('en')) return 0;
    return 1;
  }
  return null;
}

async function runProbe(){
  const notes = [];
  let tz = '', lang = '';
  try { tz = Intl.DateTimeFormat().resolvedOptions().timeZone || ''; } catch (e) {}
  lang = navigator.language || '';
  notes.push(`本机时区：${tz || '未知'}｜浏览器语言：${lang || '未知'}`);

  let info = null;
  const apis = PROBE.ip_apis || ['https://ipapi.co/json/'];
  for (const url of apis){
    try {
      const ctl = new AbortController();
      const tm = setTimeout(() => ctl.abort(), 4500);
      const resp = await fetch(url, {signal: ctl.signal});
      clearTimeout(tm);
      if (resp.ok){ info = await resp.json(); break; }
    } catch (e) {}
  }

  const suggest = {};
  if (info){
    const cc = (info.country_code || info.country || '').toUpperCase();
    const org = info.org || info.asn || '';
    notes.push(`出口地区：${cc || '未知'}｜ASN/组织：${org || '未知'}`);
    suggest.q1 = classifyIpType(org);
    suggest.q3 = classifyRegion(cc);
    const oi = classifyEnv(tz, lang, cc);
    if (oi != null) suggest.q11 = oi;
  } else {
    notes.push('未能获取出口 IP 信息（可能离线 / 被拦截；以 file:// 打开时受同源策略限制，改用 http(s) 或本地服务器可提升成功率）。');
  }

  if (Object.keys(suggest).length){
    Object.keys(suggest).forEach(qid => setAnswer(qid, suggest[qid]));
    updateProgress();
    const filled = Object.keys(suggest).map(qid => {
      const q = QUESTIONS.find(x => x.id === qid);
      return `${qid} → ${q.options[suggest[qid]].label}`;
    });
    notes.push('已按探测结果预填：' + filled.join('；'));
  }
  notes.push('以上为启发式推断，仅供参考，请按实际情况核对后修改。');
  probeMsgEl.textContent = notes.join('\n');
  probeMsgEl.classList.add('show');
}

/* ---------- 渲染结果 ---------- */
function renderResult(){
  const {total, rows} = compute();
  const lv = levelOf(total);
  const items = adviceList();

  let html = `<div class="scorecard">
    <div class="gauge" style="--p:${total};--gc:${lv.color}">
      <div class="val"><b>${total}</b><span>RISK / 100</span></div>
    </div>
    <div class="verdict">
      <span class="badge" style="color:${lv.color};background:${lv.bg}">${esc(lv.name)}</span>
      <p class="lead">${esc(lv.lead)}</p>
      <p>${esc(lv.note)}</p>
    </div>
  </div>

  <div class="panel">
    <h3>各维度风险分布</h3>
    <div class="dimbars">`;
  rows.forEach(r => {
    const pct = Math.round(r.risk * 100);
    html += `<div class="db-row">
      <div class="db-name">${esc(r.name)}</div>
      <div class="db-track"><i style="width:${pct}%;background:${barColor(r.risk)}"></i></div>
      <div class="db-val">${pct}%</div>
    </div>`;
  });
  html += `</div></div>

  <div class="panel">
    <h3>需要调整的方面（按影响优先级排序）</h3>`;

  if (!items.length){
    html += `<p class="empty">没有发现需要调整的高风险项，当前各项均处于较安全区间。</p>`;
  } else {
    html += `<div class="advice">`;
    items.forEach(it => {
      const sev = sevOf(it.risk);
      html += `<div class="adv lvl-${sev.cls}">
        <span class="tag">${sev.txt}</span>
        <span class="txt"><b>${esc(it.dim)}：${esc(it.label)}</b>${esc(it.text)}
        <span class="src">来源：${esc(it.source || '社区归纳')}
          <span class="conf conf-${it.confidence}">${it.confidence}</span></span></span>
      </div>`;
    });
    html += `</div>`;
  }
  html += `</div>`;

  resultEl.innerHTML = html;
  resultEl.classList.add('show');
  pushHistory(total, lv.name);
  if (!historyBox.hidden) renderHistory();
  resultEl.scrollIntoView({behavior:'smooth', block:'start'});
}

/* ---------- 事件绑定 ---------- */
runBtn.addEventListener('click', renderResult);

resetBtn.addEventListener('click', () => {
  Object.keys(answers).forEach(k => delete answers[k]);
  renderQuiz();
  resultEl.classList.remove('show');
  resultEl.innerHTML = '';
  probeMsgEl.classList.remove('show');
  probeMsgEl.textContent = '';
  window.scrollTo({top:0, behavior:'smooth'});
});

document.getElementById('probeBtn').addEventListener('click', async (e) => {
  const btn = e.currentTarget;
  btn.disabled = true; btn.textContent = '探测中…';
  try { await runProbe(); } catch (err) {
    probeMsgEl.textContent = '探测失败：' + (err && err.message ? err.message : err) + '（可手动作答）';
    probeMsgEl.classList.add('show');
  } finally { btn.disabled = false; btn.textContent = '自动探测我的环境'; }
});

function toggleBox(box, btn, render){
  const willShow = box.hidden;
  box.hidden = !willShow;
  if (willShow && render) render();
  btn.dataset.on = willShow ? '1' : '';
}
document.getElementById('sandboxBtn').addEventListener('click', (e) => toggleBox(sandboxBox, e.currentTarget, renderSandbox));
document.getElementById('historyBtn').addEventListener('click', (e) => toggleBox(historyBox, e.currentTarget, renderHistory));

renderQuiz();
renderSandbox();
</script>
